<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Espace étudiants | Licence MOP - USSEIN</title>

  <meta
    name="description"
    content="Espace étudiants de la Licence Management des Organisations Paysannes de l'USSEIN."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --vert-fonce: #06452e;
      --vert: #0d7650;
      --vert-clair: #e9f8f0;
      --jaune: #f4b942;
      --blanc: #ffffff;
      --fond: #f5f8f6;
      --texte: #18352a;
      --gris: #66756d;
      --bordure: #e2ece5;
      --danger: #c0392b;
      --ombre: 0 15px 40px rgba(6, 69, 46, 0.1);
      --rayon: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--fond);
      color: var(--texte);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* Barre supérieure */

    .topbar {
      background: var(--vert-fonce);
      color: white;
      padding: 10px 0;
      font-size: 13px;
    }

    .topbar-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .topbar strong {
      color: var(--jaune);
    }

    /* Navigation */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(15px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .navbar {
      min-height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo-zone {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-zone img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 50%;
    }

    .logo-text {
      line-height: 1.25;
    }

    .logo-text strong {
      display: block;
      color: var(--vert-fonce);
      font-family: "Montserrat", sans-serif;
      font-size: 18px;
      font-weight: 800;
    }

    .logo-text span {
      color: var(--gris);
      font-size: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: var(--texte);
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--vert);
    }

    .nav-login {
      background: var(--vert);
      color: white !important;
      padding: 11px 20px;
      border-radius: 50px;
    }

    .nav-login:hover {
      background: var(--vert-fonce);
      transform: translateY(-2px);
    }

    .menu-button {
      display: none;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: var(--vert);
      color: white;
      font-size: 22px;
    }

    /* Hero */

    .hero {
      position: relative;
      overflow: hidden;
      color: white;
      background:
        linear-gradient(
          120deg,
          rgba(6, 69, 46, 0.97),
          rgba(13, 118, 80, 0.9)
        ),
        url("assets/images/espace-etudiants.jpg") center/cover;
      padding: 85px 0 110px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border: 35px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      right: -130px;
      top: -130px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 200px;
      height: 200px;
      border: 25px solid rgba(244, 185, 66, 0.1);
      border-radius: 50%;
      left: -90px;
      bottom: -80px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 17px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(32px, 5vw, 60px);
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: var(--jaune);
    }

    .hero p {
      max-width: 720px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 16px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: none;
      border-radius: 50px;
      padding: 14px 23px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.3s;
    }

    .btn-primary {
      background: var(--jaune);
      color: var(--vert-fonce);
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(244, 185, 66, 0.3);
    }

    .btn-white {
      background: white;
      color: var(--vert-fonce);
    }

    .btn-white:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(255, 255, 255, 0.2);
    }

    .btn-green {
      background: var(--vert);
      color: white;
    }

    .btn-green:hover {
      background: var(--vert-fonce);
      transform: translateY(-3px);
    }

    /* Statistiques */

    .stats {
      margin-top: -45px;
      position: relative;
      z-index: 5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .stat-card {
      background: white;
      border-radius: var(--rayon);
      padding: 23px 15px;
      text-align: center;
      box-shadow: var(--ombre);
      border: 1px solid var(--bordure);
    }

    .stat-card strong {
      display: block;
      color: var(--vert);
      font-size: 27px;
      font-weight: 800;
    }

    .stat-card span {
      color: var(--gris);
      font-size: 12px;
    }

    /* Sections */

    section {
      padding: 80px 0;
    }

    .section-heading {
      max-width: 700px;
      margin: 0 auto 42px;
      text-align: center;
    }

    .mini-title {
      display: inline-block;
      color: var(--vert);
      background: var(--vert-clair);
      padding: 7px 15px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .section-heading h2 {
      font-family: "Montserrat", sans-serif;
      color: var(--vert-fonce);
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .section-heading p {
      color: var(--gris);
      font-size: 14px;
    }

    /* Tableau de bord */

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .dashboard-card {
      background: white;
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 28px 23px;
      box-shadow: var(--ombre);
      transition: 0.35s;
    }

    .dashboard-card:hover {
      transform: translateY(-7px);
      border-color: var(--vert);
    }

    .dashboard-icon {
      width: 55px;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--vert-clair);
      color: var(--vert);
      border-radius: 16px;
      font-size: 25px;
      margin-bottom: 18px;
    }

    .dashboard-card h3 {
      color: var(--vert-fonce);
      font-size: 18px;
      margin-bottom: 8px;
    }

    .dashboard-card p {
      color: var(--gris);
      font-size: 13px;
      margin-bottom: 17px;
    }

    .card-link {
      color: var(--vert);
      font-size: 13px;
      font-weight: 700;
    }

    .card-link:hover {
      color: var(--vert-fonce);
    }

    /* Ressources */

    .resources-section {
      background: white;
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .resource-card {
      overflow: hidden;
      background: white;
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      box-shadow: var(--ombre);
      transition: 0.35s;
    }

    .resource-card:hover {
      transform: translateY(-7px);
    }

    .resource-image {
      height: 190px;
      overflow: hidden;
      background: var(--vert-clair);
    }

    .resource-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.5s;
    }

    .resource-card:hover .resource-image img {
      transform: scale(1.08);
    }

    .resource-body {
      padding: 24px;
    }

    .resource-tag {
      display: inline-block;
      color: var(--vert);
      background: var(--vert-clair);
      padding: 5px 10px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .resource-body h3 {
      color: var(--vert-fonce);
      font-size: 18px;
      margin-bottom: 8px;
    }

    .resource-body p {
      color: var(--gris);
      font-size: 13px;
      margin-bottom: 17px;
    }

    /* Emploi du temps */

    .schedule-box {
      background: white;
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      box-shadow: var(--ombre);
      overflow-x: auto;
    }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    .schedule-table th,
    .schedule-table td {
      padding: 17px;
      text-align: left;
      border-bottom: 1px solid var(--bordure);
      font-size: 13px;
    }

    .schedule-table th {
      background: var(--vert-fonce);
      color: white;
      font-weight: 700;
    }

    .schedule-table tr:last-child td {
      border-bottom: none;
    }

    .schedule-table td:first-child {
      color: var(--vert-fonce);
      font-weight: 700;
    }

    .course {
      display: inline-block;
      background: var(--vert-clair);
      color: var(--vert-fonce);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Annonces */

    .announcements-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 25px;
    }

    .announcement-box,
    .notice-box {
      background: white;
      border: 1px solid var(--bordure);
      border-radius: var(--rayon);
      padding: 28px;
      box-shadow: var(--ombre);
    }

    .announcement {
      display: flex;
      gap: 15px;
      padding: 18px 0;
      border-bottom: 1px solid var(--bordure);
    }

    .announcement:first-child {
      padding-top: 0;
    }

    .announcement:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .announcement-date {
      min-width: 58px;
      height: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--vert-clair);
      color: var(--vert-fonce);
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
    }

    .announcement h3 {
      color: var(--vert-fonce);
      font-size: 15px;
      margin-bottom: 5px;
    }

    .announcement p {
      color: var(--gris);
      font-size: 13px;
    }

    .notice-box h3 {
      color: var(--vert-fonce);
      font-size: 19px;
      margin-bottom: 15px;
    }

    .notice-box p {
      color: var(--gris);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .notice-list {
      list-style: none;
      margin-bottom: 22px;
    }

    .notice-list li {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--gris);
      font-size: 13px;
    }

    .notice-list li::before {
      content: "✓";
      color: var(--vert);
      font-weight: 800;
    }

    /* FAQ */

    .faq {
      max-width: 850px;
      margin: auto;
    }

    .faq-item {
      background: white;
      border: 1px solid var(--bordure);
      border-radius: 15px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      border: none;
      background: white;
      color: var(--vert-fonce);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 20px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }

    .faq-question span {
      color: var(--vert);
      font-size: 23px;
      transition: 0.3s;
    }

    .faq-answer {
      display: none;
      padding: 0 20px 20px;
      color: var(--gris);
      font-size: 13px;
    }

    .faq-item.active .faq-answer {
      display: block;
    }

    .faq-item.active .faq-question span {
      transform: rotate(45deg);
    }

    /* Appel à l'action */

    .cta {
      background:
        linear-gradient(
          120deg,
          rgba(6, 69, 46, 0.97),
          rgba(13, 118, 80, 0.9)
        ),
        url("assets/images/campus.jpg") center/cover;
      border-radius: 30px;
      padding: 65px 25px;
      color: white;
      text-align: center;
    }

    .cta h2 {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(26px, 4vw, 42px);
      margin-bottom: 15px;
    }

    .cta p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
    }

    /* Pied de page */

    footer {
      background: var(--vert-fonce);
      color: white;
      padding: 45px 0 20px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 35px;
      margin-bottom: 35px;
    }

    footer h3 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    footer p,
    footer a {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
    }

    footer a {
      display: block;
      margin-bottom: 8px;
      transition: 0.3s;
    }

    footer a:hover {
      color: var(--jaune);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    /* Fenêtre de connexion */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: min(440px, 100%);
      background: white;
      border-radius: 22px;
      padding: 30px;
      position: relative;
      animation: modalAppear 0.3s ease;
    }

    @keyframes modalAppear {
      from {
        opacity: 0;
        transform: translateY(-20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 17px;
      border: none;
      background: transparent;
      font-size: 25px;
      color: var(--gris);
    }

    .modal-content h2 {
      color: var(--vert-fonce);
      font-family: "Montserrat", sans-serif;
      margin-bottom: 8px;
    }

    .modal-content p {
      color: var(--gris);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      color: var(--vert-fonce);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      border: 1px solid var(--bordure);
      border-radius: 10px;
      padding: 13px;
      outline: none;
      font-size: 13px;
    }

    .form-group input:focus {
      border-color: var(--vert);
      box-shadow: 0 0 0 3px var(--vert-clair);
    }

    .form-message {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: var(--vert-clair);
      color: var(--vert-fonce);
      font-size: 13px;
    }

    .form-message.show {
      display: block;
    }

    /* Animations */

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */

    @media (max-width: 1000px) {
      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .announcements-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .nav-links {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 15px 5%;
        background: white;
        box-shadow: 0 15px 25px rgba(0, 0, 0, 0.08);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 12px 0;
      }

      .nav-login {
        text-align: center;
        margin-top: 5px;
      }

      .menu-button {
        display: block;
      }

      .resources-grid {
        grid-template-columns: 1fr 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .topbar-content {
        justify-content: center;
        text-align: center;
      }

      .topbar-content span:last-child {
        display: none;
      }

      .hero {
        padding: 65px 0 90px;
      }

      .hero p {
        font-size: 14px;
      }

      section {
        padding: 60px 0;
      }

      .dashboard-grid,
      .resources-grid,
      .stats-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .announcement {
        align-items: flex-start;
      }

      .cta {
        padding: 45px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Barre supérieure -->
  <div class="topbar">
    <div class="container topbar-content">
      <span>
        🎓 <strong>Espace étudiants</strong> — Licence MOP
      </span>

      <span>
        USSEIN - Kaffrine
      </span>
    </div>
  </div>

  <!-- Navigation -->
  <header>
    <div class="container navbar">

      <a href="index.html" class="logo-zone">
        <img
          src="assets/images/logo-mop.jpg"
          alt="Logo Licence MOP"
        >

        <div class="logo-text">
          <strong>Licence MOP</strong>
          <span>USSEIN - Kaffrine</span>
        </div>
      </a>

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Ouvrir le menu"
      >
        ☰
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="formation.html">Formation</a></li>
        <li><a href="parcours.html">Parcours</a></li>
        <li><a href="debouches.html">Débouchés</a></li>
        <li><a href="#contact">Contact</a></li>
        <li>
          <a href="#" class="nav-login" id="openLogin">
            🔐 Connexion
          </a>
        </li>
      </ul>

    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container hero-content">

      <div class="hero-label">
        📚 Bienvenue dans votre espace universitaire
